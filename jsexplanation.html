<!--
Js-is a high level dynamic programing language
use to make web pages interactive or responsive

HTML->Structure
CSS->Styling
JS->Functionality

Execution Flow:
                 Source code
                      |
                Interpreter
                      |
             machine executes one 
             line at a time with JIt
                      |
                Machine code            
JIT : It is a technique code is compiled 
into machine code while program is running
->instead of compiling everything beforehand

JIT compiler: Identifies frequently executed code
("Hot code")
It compiles that code into optimized machine code

JavaScript(v8 Engine in chrome and node.js)
java--JVM
How js woks in browser:
  HTML
   |
 browser
   |
 HTML parser
   |
 DOM created
   |
 Java Script engine(js)
   |
 page          




-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Expalnation</title>
</head>
<body>
    <h1>Welcome to Chalapathi</h1>
    <!--<button onclick="showMessage()">click me</button>-->
    <script>
        //variables:
        //var,let,const-->keywords
        var account_num = 7645677

        let a = 10;
        let b = 20;
        console.log(a);
        console.log(b);
        const year=2006;
        const pi=3.14;
        console.log(pi)
        //let year=2009;
        //let a = 20
        var account_num = 7235419;
        console.log(account_num)
        var first_name="Prathyusha"
        //Data Types
        //1.Strings
        let name="Prathyusha"
        console.log(typeof name)
        //2.Number
        let num = 20;
        console.log(typeof num);
        //3.Boolean
        let isStudent = true;
        console.log(typeof isStudent)
        //4.undefined
        let salary;
        console.log(typeof salary)
        //5.Null
        let data = null;
        console.log(typeof data)
        //6.Object
        let student={
            name:"Prathyusha",
            rollno:6
        };
        console.log(typeof student)
        //operators:
        let x = 5;
        let y = 6;
        console.log(x+y)
        //Assignment Operator
        let d = 5;
        d += 5
        //comparission Operators
        //<,>...
        //Strictly equal to
        console.log(x === y)
        //Logical operators:
        //&&,|,!
        console.log(alert("Welcome full stack"));
        //Prompt:
        let number = prompt("Enter the number:")
        console.log(number)
        let result = confirm("Are you sure?")
        console.log(result)
        //Template Literal
        let myname = "Prathyusha"
        console.log("Hello"+myname);
        console.log(`Hello ${myname}`);
        //Task:Two numbers from user
        //perform addition,sub,mul,div
        //make sure to use template literals
        let p = 10;
        let q = 20;
        let add = p+q;
        let sub = p-q;
        let mul = p*q;
        let div = p/q;
        console.log(`Addition: ${p}+${q}={add}`);
        console.log(`Subtraction: ${p}-${q}= {sub}`);
        console.log(`Multiplication: ${p}*${q}={mul}`);
        console.log(`Division: ${p}/${q}={div}`);

    </script>
</body>
</html>
